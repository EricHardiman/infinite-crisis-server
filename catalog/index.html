<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Crisis ID Catalog</title>
<meta name="description" content="Game IDs for the Infinite Crisis preservation server: champions, skills, Stolen Powers, stages and engine reference.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --panel-2: #eef0f5; --ink: #151821; --muted: #5d6475;
  --line: #dde1ea; --accent: #c8102e; --accent-ink: #ffffff; --accent-soft: #fbe7ea;
  --side-bg: #12151d; --side-ink: #c9cfdc; --side-muted: #7b8396; --side-hover: #1d2230; --side-active: #262c3d;
  --ok: #1d7a46; --ok-bg: #e2f4ea; --info: #1f5fbf; --info-bg: #e3edfb; --warn: #9a6200; --warn-bg: #fdf1dc;
  --off: #5d6475; --off-bg: #eceef3; --shadow: 0 1px 2px rgba(16,20,30,.06), 0 4px 16px rgba(16,20,30,.05);
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1016; --panel: #151922; --panel-2: #1b2030; --ink: #e7eaf1; --muted: #98a0b3;
    --line: #262c3b; --accent: #ff3b55; --accent-ink: #ffffff; --accent-soft: #3a1820;
    --side-bg: #090b10; --side-hover: #141823; --side-active: #1c2130;
    --ok: #4fd18b; --ok-bg: #12301f; --info: #74a8ff; --info-bg: #142540; --warn: #f2b545; --warn-bg: #3a2a0c;
    --off: #98a0b3; --off-bg: #20263a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1016; --panel: #151922; --panel-2: #1b2030; --ink: #e7eaf1; --muted: #98a0b3;
  --line: #262c3b; --accent: #ff3b55; --accent-ink: #ffffff; --accent-soft: #3a1820;
  --side-bg: #090b10; --side-hover: #141823; --side-active: #1c2130;
  --ok: #4fd18b; --ok-bg: #12301f; --info: #74a8ff; --info-bg: #142540; --warn: #f2b545; --warn-bg: #3a2a0c;
  --off: #98a0b3; --off-bg: #20263a; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, sans-serif; }
a { color: inherit; }
.app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }

/* ---- sidebar ---- */
.side { background: var(--side-bg); color: var(--side-ink); position: sticky; top: 0; height: 100vh;
  overflow-y: auto; display: flex; flex-direction: column; }
.brand { padding: 22px 20px 18px; border-bottom: 1px solid #ffffff10; }
.brand .mark { display: flex; align-items: center; gap: 10px; }
.brand .x { width: 30px; height: 30px; border-radius: 6px; background: var(--accent); display: grid;
  place-items: center; font: 700 18px "Barlow Condensed", sans-serif; color: #fff; transform: skew(-8deg); }
.brand h1 { margin: 0; font: 700 21px/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; color: #fff;
  text-transform: uppercase; }
.brand p { margin: 8px 0 0; font-size: 12px; color: var(--side-muted); }
.nav { padding: 10px 10px 24px; flex: 1; }
.nav h2 { margin: 18px 10px 6px; font: 600 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase;
  color: var(--side-muted); }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px;
  border-radius: 7px; text-decoration: none; color: var(--side-ink); font-weight: 500; position: relative; }
.nav a:hover { background: var(--side-hover); }
.nav a.active { background: var(--side-active); color: #fff; }
.nav a.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 2px; background: var(--accent); }
.nav .count { font: 500 11px var(--mono); color: var(--side-muted); background: #ffffff0d; padding: 1px 7px;
  border-radius: 10px; }
.nav .count.zero { opacity: .5; }
.side-foot { padding: 14px 20px; border-top: 1px solid #ffffff10; font-size: 12px; color: var(--side-muted); }
.side-foot button { background: none; border: 1px solid #ffffff22; color: var(--side-ink); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; font: inherit; }

/* ---- main ---- */
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; gap: 12px;
  align-items: center; }
.menu-btn { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  width: 38px; height: 38px; color: var(--ink); cursor: pointer; font-size: 18px; }
.search { flex: 1; position: relative; max-width: 560px; }
.search input { width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); padding: 0 12px 0 36px; font: inherit; outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
.scope { font-size: 12px; color: var(--muted); white-space: nowrap; }
.content { padding: 26px 28px 60px; max-width: 1400px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  margin-bottom: 16px; }
.head h2 { margin: 0; font: 700 34px/1 "Barlow Condensed", sans-serif; letter-spacing: .02em; text-transform: uppercase; }
.head .kicker { font: 600 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 6px; }
.desc { color: var(--muted); max-width: 860px; margin: 0 0 18px; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.meta code { font-family: var(--mono); background: var(--panel-2); padding: 2px 6px; border-radius: 5px; }

/* ---- table ---- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  overflow: hidden; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font: 600 11px Inter, sans-serif;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; white-space: nowrap;
  border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
th:hover { color: var(--ink); }
th .arrow { opacity: .35; margin-left: 4px; }
th.sorted .arrow { opacity: 1; color: var(--accent); }
td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
td.notes { color: var(--muted); min-width: 300px; max-width: 520px; }
td.wide { min-width: 220px; max-width: 420px; }
td .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
td .clamp.open { -webkit-line-clamp: unset; display: block; }
.id { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px var(--mono); white-space: nowrap; }
.id button { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--muted); border-radius: 4px;
  line-height: 0; opacity: .55; }
.id button:hover { opacity: 1; color: var(--accent); background: var(--accent-soft); }
.hexlist { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font: 600 11.5px Inter, sans-serif;
  white-space: nowrap; background: var(--off-bg); color: var(--off); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.empty { padding: 40px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }
.more { padding: 12px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.more button { font: inherit; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0;
  border-radius: 7px; padding: 5px 10px; cursor: pointer; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---- overview ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin: 8px 0 28px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  text-decoration: none; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; display: block; }
.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile .n { font: 700 32px/1 "Barlow Condensed", sans-serif; }
.tile .t { font-weight: 600; margin-top: 4px; }
.tile .g { font-size: 12px; color: var(--muted); }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.howto .card { padding: 16px 18px; }
.howto h3 { margin: 0 0 6px; font-size: 14px; }
.howto p { margin: 0; color: var(--muted); }
.howto code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.group-label { font: 600 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin: 26px 0 10px; }
.hit-section { margin-bottom: 26px; }
.hit-section h3 { margin: 0 0 8px; font: 700 20px "Barlow Condensed", sans-serif; text-transform: uppercase; }
.hit-section h3 a { text-decoration: none; }
.hit-section h3 a:hover { color: var(--accent); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px;
  transition: .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 30; transform: translateX(-100%);
    transition: transform .2s; }
  .app.open .side { transform: none; box-shadow: 0 0 0 100vmax #0008; }
  .menu-btn { display: inline-grid; place-items: center; }
  .top { padding: 10px 16px; }
  .content { padding: 20px 16px 48px; }
  .scope { display: none; }
  .head h2 { font-size: 28px; }
}
</style>
</head>

    <main class="content" id="content"></main>

</div>

ound to 0x1000033E, a type-3 spawn whose property table names FX 0x1E00037F / 0x1E000380 / 0x1E00037E (particles 0x18000A3A / 39 and 0x18000A4D), offset (0, 0, 2), duration 0x100008D7 <- 0x1000033E, and a type-8 overlay 0x170011FB (0xFF78B8F5). P: the streaks are the type-3 spawn; why it does not show is open (aggro-recall-scorepanel.md 2). 2026-10-30 (tester 15:30: the six converging lights still missing): the fase3-ij hold re-sent the run with its own number 4 times (a signal to a live run, client-scriptlets-graphs.md 1.4); now sent once 0.12 s after its tick, never re-sent (start_scriptlet_hold_mode defer). Its type-3 spawn is the client's timed indicator object (0xA847E0: 0x10000940-0x10000945, 0x100008D7). core-door-regen.md 6"],["0x1E00037F","Recall streak FX (start, P)","champion recall (child of 0x1E00009C)","data only","Particles 0x18000A3A / 0x18000A39; named as 0x10000941 by the recall template's type-3 spawn (aggro-recall-scorepanel.md 2)."],["0x1E000380","Recall streak FX (loop, P)","champion recall (child of 0x1E00009C)","data only","Same body as 0x1E00037F; 0x10000942 of the type-3 spawn."],["0x1E00037E","Recall streak FX (end, P)","champion recall (child of 0x1E00009C)","data only","Particle 0x18000A4D, light 0xFFF9EB90; 0x10000943 of the type-3 spawn."]]},{"id":"cinematics","title":"Cinematics","file":"data/cinematics.tsv","description":"Cinematics (0x35) and cinematic scriptlets: when they play and what the server does around them.","columns":["id","name","duration_s","server_status","notes"],"rows":[["0x35000026","Intro (match start)","","implemented","[match] cinematic: sent with 0x20F5 cinematic_delay (5 s) after the load-complete notice 0x1000015E; the tutorial script starts on its state-4 notice. Both paddy wagons explode in it with their own Vfx_OnExplode 0x10000079 (no variables). Layout listing attributes 01RangedA, 01MeleeA/B and 02Destroyer to it."],["0x35000034","Catwoman breaks the street vehicle","","implemented","Sent once the practice drones are down and the queued lines are spoken (catwoman_wait_scale 0.5). Actors: Gaslight_Batman (0x2E0001B2, starts with Fidgets_Disable 0x10000320) and Gaslight_Catwoman (0x2E0007C0). The player's Batman is placed on the actor (40.687, 58.229) and hidden with 0x90F; the vehicle goes 6 s in (vehicle_break_at). Its own lines carry conversation flag 0x4000 (0x1AF, 0x357, 0x358): the server must not send them. State 4 starts part 2 (bridge.py)."],["0x35000033","Drone fights the thugs","","data only","Not played by the server; source of the first drone's spot (Drone_01 at (34.98, 56.32)). Actors Drone_01 (0x2E001167), Thug_01 / Thug_02 (0x2E0012BB), Gaslight_Batman_01. The drone attacks with CinematicCombatBasicAttack 0x1000010F, explodes with Vfx_OnExplode 0x10000079 at frame 231; a thug plays _Defeat_OnDead 0x100001FA at 236."],["0x35000028","The Destroyer arrives","","implemented","Sent 1 + sphere_fall_seconds after the strength drones die, once the sphere 0x2E000AC5 has dropped. Shows the Destroyer (0x2E000AB5) and four drones walking out (layout 0x1D000774: Melee1/2, Ranged1/2). Its own lines 0x1CF. The Destroyer is spawned before it (destroyer_in_cinematic). 60 s timeout if no state 4 arrives."],["0x35000025","Ending: the last gate opens","23.0","implemented","Sent ending_delay (1 s) after the Destroyer falls; Batman hidden as it starts. Actors GaslightBatman (0x2E0001B2), Gate (0x2E000CD7, template 0x1D000789) and PowerCore (0x2E000AC5, template 0x1D00078A). Lines 0x1BC. VICTORY billboard + 0x2038 + Cinematic_Victory at 18.5 s (victory_in_cinematic), match end at 22.6 s (match_end_in_cinematic). Earlier tried as a pre-intro 'power cores falling' cinematic (pre_cinematics)."],["0x10000A9E","Cinematic_Victory (scriptlet on Batman)","","sent","victory_keys, played with the VICTORY billboard. The exe does not reference the name; effect not confirmed."],["0x1000000F","EndOfMatch_CinematicCamera (input context)","","data only","UI action type 0x10000019; driven by ver/messages.py and docs/reverse-engineering.md.","columns":["id","direction","name","server_status","notes"],"rows":[["0x2","both","Notice (generic)","handled","Client: cinematic state, input notices. Server: tutorial hint."],["0x3","server","Remove object","sent",""],["0x4","server","Create / update object (with properties)","sent","Batch 0x4 with 0xF2 descriptor. To a live object it rebuilds nothing: 0xF2 is a no-op while its u32 equals entity+0x110 (0); 0xBC is a diff (0x62AFD0: sets the sent ids as 0x6 does, removes the object's own net-mode 1/3 ids it omits); 0xB0 is one more movement state; a batch with only 0xB0 reaches the same listener 0x60AFA0 (object-update-bundles.md, fase3-if). ics [ics] object_update_mode \"delta\" (fase3-if): the full batch only creates an object (and for creation retries, a champion's death / respawn, array / table changes); its updates are a batch with only the 0xB0 plus 0x6 / 0x86 (World.delta)."],["0x6","server","Set one property","sent","u8 0 | property entry (u32 id, packed id, value); handler 0x635360 -> collection change path. ics: late unit flags (fase3-gd); fase3-if delta updates: one per changed property of a live object (World.delta; an equal value notifies nothing, 0x578DE0). Open: the static read path 0x445530 is base u8 + 0x509740 (packed id + value, the 0xBC table's per-entry reader) with no u32 before it, yet ics's u32-first form works in the game (2026-10-23 diag --target: a 0 -> flags toggle by 0x6 set the unit cache)."],["0x42","server","Vitals (health, secondary resource)","sent","Only to objects with a vitals component. Sent with every champion bundle. Handler 0xAB2880 -> 0xAB1BD0 dereferences [entity+0x80] with no null check (crash rva 0x6B1BD9); the component exists only if PerceivedType 0x1000019D & 0x7F59FB at creation; ics checks that (vitals_need_perceived_type, fase3-in)."],["0x86","server","Remove one property","sent","u8 0 | u32 id (reader 0x839500); exec 0x699210 -> 0x6353B0 -> property component vt+0x54 (0x577E10): notified as removed, or as changed back to the class template's value (object-update-bundles.md). ics fase3-if (P, never seen in the game yet): one per id of network mode 1 / 3 (MasterProperty 0x32000000) that left a live object's list, what a full bundle's 0xBC removed ([ics] delta_remove_missing; net-0 ids only with delta_remove_net0)."],["0x8A","server","Destruction impulse (sphere): u8 0 | Position | f32 radius | magnitude | u32 level | u32 hit key | u32 FX | u8","sent","Exec 0x698350, handler 0x632590 -> 0x632370: impulse object 0x630E80, physics sphere query 0x631C50 (0x5CEA30; piece bodies 0x631B00, destructible entities 0x631940), applied by 0x631FA0 only when something was found: piece health -= magnitude (0x62F290 -> 0x62BEF0 -> 0x62BC00), break at <= 0. Breaks only pieces whose bodies (made by 0x8B at the entity's frame) are inside the sphere: ics rebuilds a landed vehicle (0x8B) first ([ics] liftable_land_rebuild, fase3-im; liftable-throw-destruction.md 3). full-protocol.tsv; ics (fase3-gm, fase3-ij)"],["0x8D","server","Start scriptlets on an entity","sent","Animations, VFX, sounds; key must be in the entity's table. Replaces: the list handler 0x627E20 first stops every run an earlier network order started on the object (0x627E4D -> 0x57CB60, filter vtable 0x15C9750 / 0x6272D0 = context byte +0x60), then starts or signals the entries (0x6279D0); a dead run's number starts a new run. ics sends a champion's orders of one moment as one 0x8D and re-sends its held StartScriptlet runs in each ([ics] scriptlet_orders, ics/scriptlet_orders.py)."],["0xB0","server","Movement state (batch sub-event or standalone)","sent","Exec 0x698CD0 -> 0x6298D0: the object's 0xB0 listeners (movement 0x60AFA0: merge 0x57DA90, push 0x609C70, same module seq = no-op 0x553E70; containment 0x6113E0: parent IID 0 only clears a queued attach). ics sends it inside 0x4 (object-update-bundles.md); fase3-if delta mode: alone in a 0x4 batch for every update of a live object (pvp_movement_state, with the 0x04 attach block; same bytes as the bundle's). Motion bits 0x400 (s16 facing pitch) / 0x4000 (s16 roll), rad * 10000 after the facing yaw: sent for a thrown vehicle's nose-down ([ics] liftable_throw_pitch, fase3-il, agl-arm-meteor-vehicle-tilt.md 3)."],["0xBC","server","Set a property table (batch sub-event or standalone)","sent","Exec 0x699330 -> 0x635440 -> vt+0xA4 0x62AFD0: equal values notify nothing (deep compare for arrays / tables), changed ids notify, omitted own ids of net mode 1 / 3 are removed. ics sends it inside 0x4 (object-update-bundles.md)."],["0xCC","client","Level loaded","ignored","Sent with the 10/15 % loading step."],["0xCE","server","Account character set","sent","Login."],["0xEB","server","Set local player","sent","At login and again before every later match (the world teardown resets it). Must be re-sent before every match after the first: the world teardown clears the local IID (0x635250(0,0)); ics sends it in ConnectToLobby (fase3-hj)."],["0x11F","server","Stop a scriptlet run on an entity","sent","u8 0 | u32 key | u32 run instance (0xFFFFFFFF = every run of the key) | u8 flag (0 / 1). Serializer 0x6751A0, exec 0x675280 -> script component 0x57C4B0 -> 0x529EF0 (end list, state 5, attachments released). The real stop: a 0x8D with a live run's instance and a signal bit only runs the definition's signal handlers (0x534290). Builder ics/messages.py stop_scriptlet (fase3-if); sent only with the opt-in [ics] death_overlay_scriptlets, to end _CDefeatSystem_DeathOverlay's run at the respawn and at the match end ([ics] death_overlay_stop) (docs/re-notes/death-animation.md 4, 11). fase3-ih: also at the Crime Alley relay's unlock (Raider arrival): stops Vfx_Locked, every run ([ics] match_nook_pad unlock_stop; throw-truck-padlock.md 4). fase3-ij: the u8 is 0x57C4B0's mode argument (passed to the component's vt+0x7C); the client's own StopScriptletKey path 0x588A80 passes 1; the relay stop now sends 1 for Vfx_Locked and _Selection_Usage_Locked, again 0.5 / 2 s later (unlock_stop_flag / unlock_stop_again; throw-padlock-coredeath.md 2). A script's StopScriptlet now goes as 0x11F with u8 1 ([ics] scriptlet_orders)."],["0x100","server","Packet: ServerSwitch","sent","u32 sequence; makes the game connection current."],["0x12D","client","Left the match world","handled","After the match ends (teardown)."],["0x800","server","Packet: Referral","sent","u64 cookie | u16 | u8 | u8 | u16 port | char[256] host. After AcceptMatch."],["0x2001","server","Start conversation","sent","u8 0 | u64 | u32 | u32 key | list<u64> speakers | u8 | u32 instance; handler 0xa13b90 -> dialog system vt+8. ics: one instance id per conversation (fase3-ge)"],["0x2009","server","Objective update","sent",""],["0x200D","client","RequestChangeAmplifierSet","handled","full-protocol.tsv; ics (fase3-gm)"],["0x200F","server","Effects: add one effect instance (u8 = fresh)","sent","full-protocol.tsv; ics (fase3-gm) Crashes this client build (null record in the network ctor 0x44BD00 path): never sent (fase3-hj)."],["0x2016","server","End room check","sent","Lobby.HideBackButton = SetLobbyTransition (0xab9080 -> 0xab8ec0, UI event 0x23): lobby -> loading screen; sent after champion select (0x2053)."],["0x201E","client","RequestAllPregameTips","handled","full-protocol.tsv; ics (fase3-gm)"],["0x2021","server","Exit lobby","off","u8 0 | u32 room id; handler 0xABC480 runs a world teardown (and the client goes home). Not sent after a match (exit_lobby_after_match = false, 2026-10-28: it ran a second teardown while the end page was built)."],["0x2024","server","Deliver encounter info","sent","Login. Lists: DIDs, queue flags (0x200000 blind, 0x20000 draft, 0x10000 ranked), per-encounter access strings (empty = all), u32 list (zeros). Handler 0xA733B0."],["0x2026","client","Lobby Draft_RequestTrade (Lobby listener 0x1604b84 slot 0x4 = raise 0x918610 slo","handled","full-protocol.tsv; ics (fase3-gm)"],["0x2028","server","Lobby room created"," xA0000039","descriptor table","3822 descriptors (unpack 0x502750: u32 tag, id / kind, group / container, network mode at byte +0x16, flags, defaults; whole words). ics reads each network mode at first use (Data.network_mode): World.delta removes by 0x86 only the net-1 / 3 ids a full bundle's 0xBC would have removed (object-update-bundles.md 13, fase3-if)."],["0x300000A4","Animation graph event name table","-","name table","Different numbering from 0x33000000: the same id can name another thing."],["0x34000164","Super Strength server script","0xA00000B3","server script","InitObjectPickup 0x100007A2 on Batman; PickupObject 0x100007A1 and ThrowObject 0x100007A0 on Batman and the object; hit effects on the target; _Combat_GoToLocomotion. S4 = RaiseEvent(TargetIID)[0x10000037] + input hold node 0x100000AD until 0x100000BB (S4 -> S3: StartCooldown); with no 0x100000BB the champion cannot move and the 90 s cooldown never starts (C, 2026-10-30 run 11:10-11:16, liftable-softlock.md 1). S0 -> S2 -> S4 needs EntityExists + IsTargetable(TargetIID): an order with target 0x0 keeps the VM's last TargetIID (P: the original cleared it)."],["0x34000167","Thrown object script","0xA00000B3","server script","Runs on the thrown object: Vfx_OnThrown 0x1000087A at 0.3 s; on collision Vfx_OnCollision 0x10000016, skill 0x48000295 on the target (Destructible_AdvanceState = 1, knockdown script 0x34000131), hit effects, Vfx_OnExplode 0x10000079, a destruction push, 0x1000001C."],["0x1D0008EF","Destructible object script table (analog of the wagons 0x1D0000BA/BB)","0xA00000B3","script table","Vfx_OnInit, Vfx_OnCollision, Vfx_OnExplode, destroy entity; particles 0x180006C3/C4 and debris model 0x170001C6."],["0x480003C9","Super Strength throw skill","0xA00000B3","skill","Linked skill 3 of base 0x480003CB (0x10000855). Script 0x34000161 (ThrowObject), targeting 1 (ground), stat 0x17 = 9 m range, stat 0x12 = 2.5 m radius, ground markers 0x100006D7 = 0x48000155 / 0x100006D8 = 0x48000156 (decal 0x1700 const SECTIONS = CATALOG.flatMap(g => g.sections.map(s => ({...s, group: g.group})));
const BY_ID = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const HEX = /^0x[0-9a-f]+(:\d+)?$/i;
let sortState = {};
const expanded = {};

function theme() {
  try { const t = localStorage.getItem("ic-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
}
theme();
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ic-theme", next); } catch (e) {}
};
$("#menuBtn").onclick = () => $("#app").classList.toggle("open");

function nav(active) {
  let h = `<h2>Start</h2><a href="#overview" class="${active === "overview" ? "active" : ""}"><span>Overview</span></a>`;
  for (const g of CATALOG) {
    h += `<h2>${esc(g.group)}</h2>`;
    for (const s of g.sections)
      h += `<a href="#${s.id}" class="${active === s.id ? "active" : ""}"><span>${esc(s.title)}</span>` +
           `<span class="count ${s.rows.length ? "" : "zero"}">${s.rows.length}</span></a>`;
  }
  $("#nav").innerHTML = h;
}

function hl(text, q) {
  const t = esc(text);
  if (!q) return t;
  const i = String(text).toLowerCase().indexOf(q);
  if (i < 0) return t;
  return esc(String(text).slice(0, i)) + "<mark>" + esc(String(text).slice(i, i + q.length)) + "</mark>" +
         esc(String(text).slice(i + q.length));
}

const COPY = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
function idCell(v, q) { return `<span class="id">${hl(v, q)}<button type="button" data-copy="${esc(v)}" title="Copy">${COPY}</button></span>`; }

function badge(v) {
  const s = v.toLowerCase();
  const cls = /implemented|playable|handled/.test(s) ? "ok" : /sent|shown|data only/.test(s) ? "info"
            : /ignored|off|not sent|partial/.test(s) ? "warn" : "";
  return `<span class="badge ${cls}">${esc(v)}</span>`;
}

function cell(col, v, q) {
  if (v === undefined || v === null || v === "") return "";
  if (/status$/.test(col)) return badge(v);
  const parts = String(v).split(/\s+/);
  if (parts.length > 1 && parts.every(p => HEX.test(p))) return `<div class="hexlist">${parts.map(p => idCell(p, q)).join("")}</div>`;
  if (HEX.test(v)) return idCell(v, q);
  return hl(v, q);
}

function tdCell(c, v, q) {
  const long = /notes|purpose|contents|meaning|when|description/.test(c) ? "notes"
             : /stats|targets|used_in|passives|lists|attack_scripts|record_types|costume/.test(c) ? "wide" : "";
  const html = cell(c, v, q);
  return `<td class="${long}">${long && String(v || "").length > 160 ? `<div class="clamp" title="Click to expand">${html}</div>` : html}</td>`;
}

function matches(row, q) { return !q || row.some(c => String(c).toLowerCase().includes(q)); }

function sorted(s, rows) {
  const st = sortState[s.id];
  if (!st) return rows;
  const i = st.col, dir = st.dir;
  const val = x => { const v = x[i] || ""; return HEX.test(v) ? parseInt(v, 16) : (/^-?\d+(\.\d+)?$/.test(v) ? parseFloat(v) : v.toLowerCase()); };
  return [...rows].sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
}

function table(s, rows, q) {
  if (!s.columns.length || !s.rows.length)
    return `<div class="card"><div class="empty"><strong>No entries yet</strong>${esc(s.description)}</div></div>`;
  if (!rows.length) return `<div class="card"><div class="empty"><strong>No match</strong>Nothing in ${esc(s.title)} matches “${esc(q)}”.</div></div>`;
  const st = sortState[s.id] || {};
  const th = s.columns.map((c, i) => `<th data-col="${i}" class="${st.col === i ? "sorted" : ""}">${esc(c.replace(/_/g, " "))}` +
    `<span class="arrow">${st.col === i ? (st.dir > 0 ? "▲" : "▼") : "↕"}</span></th>`).join("");
  const all = sorted(s, rows), LIMIT = 400, showAll = expanded[s.id] || q;
  const shown = showAll ? all : all.slice(0, LIMIT);
  const more = all.length > shown.length
    ? `<div class="more"><button type="button" data-more="${s.id}">Show all ${all.length} rows</button> or search to narrow them.</div>` : "";
  const body = shown.map(r => "<tr>" + s.columns.map((c, i) =>
    tdCell(c, r[i], q)).join("") + "</tr>").join("");
  return `<div class="card"><div class="tbl-wrap"><table data-section="${s.id}"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>${more}</div>`;
}

  return `<div class="head"><div><div class="kicker">Reference</div><h2>Game ID Catalog</h2></div></div>
  <p class="desc">Every game ID the server works with, in one place. The ID is the key: the client only understands
  the game's own IDs (DIDs), so assign things by ID and use the names only to find them. Hex IDs have a copy button.</p>
  <div class="tiles">${tiles}</div>
  <div class="group-label">How to use it</div>
  <div class="howto">
    <div class="card"><h3>Find</h3><p>Search a name or an ID in the bar above; it looks in every section. Click a column to sort.</p></div>
    <div class="card"><h3>Assign</h3><p>Copy an ID into <code>config.toml</code>, e.g. <code>strength_skill = "0x48000A3B"</code> or by name: <code>"Super Strength / Superman"</code>.</p></div>
    <div class="card"><h3>Status</h3><p><b>implemented</b>: the server makes it work. <b>data only</b>: the ID is known, behaviour not written yet.</p></div>
    <div class="card"><h3>Update</h3><p>Edit <code>catalog/data/*.tsv</code> and run <code>python tools/build_catalog.py</code>. Never put game files here, only IDs and names.</p></div>
  </div>`;
}

function search(q) {
  let h = `<div class="head"><div><div class="kicker">Search</div><h2>Results for “${esc(q)}”</h2></div></div>`;
  let n = 0;
  for (const s of SECTIONS) {
    const rows = s.rows.filter(r => matches(r, q));
    if (!rows.length) continue;
    n += rows.length;
    h += `<div class="hit-section"><h3><a href="#${s.id}">${esc(s.title)}</a> <span class="badge">${rows.length}</span></h3>${table(s, rows.slice(0, 50), q)}</div>`;
  }
  return n ? h : h + `<div class="card"><div class="empty"><strong>No match</strong>Try a shorter name or the ID without leading zeros.</div></div>`;
}

function render() {
  const id = (location.hash || "#overview").slice(1);
  const q = $("#q").value.trim().toLowerCase();
  const s = BY_ID[id];
  nav(s ? id : "overview");
  $("#scope").textContent = s ? `in ${s.title}` : "in every section";
  if (!s) { $("#content").innerHTML = overview(q); return; }
  const rows = s.rows.filter(r => matches(r, q));
  $("#content").innerHTML = `<div class="head"><div><div class="kicker">${esc(s.group)}</div><h2>${esc(s.title)}</h2></div>
    <div class="meta"><span>${q ? `${rows.length} of ` : ""}${s.rows.length} entries</span><span>·</span><code>catalog/${esc(s.file)}</code></div></div>
    <p class="desc">${esc(s.description)}</p>${table(s, rows, q)}`;
}

document.addEventListener("click", e => {
  const mb = e.target.closest("[data-more]");
  if (mb) { expanded[mb.dataset.more] = true; render(); return; }
  const cl = e.target.closest(".clamp");
  if (cl && !e.target.closest("[data-copy]")) { cl.classList.toggle("open"); return; }
  const b = e.target.closest("[data-copy]");
  if (b) {
    const v = b.dataset.copy;
    const done = () => { const t = $("#toast"); t.textContent = `Copied ${v}`; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1300); };
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(done, done); else done();
    return;
  }
  const th = e.target.closest("th[data-col]");
  if (th) {
    const sid = th.closest("table").dataset.section, col = +th.dataset.col;
    const st = sortState[sid];
    sortState[sid] = st && st.col === col ? {col, dir: -st.dir} : {col, dir: 1};
    render();
    return;
  }
  if (e.target.closest(".nav a")) $("#app").classList.remove("open");
});
$("#q").addEventListener("input", render);
addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
render();
</script>
</body>
</html>
